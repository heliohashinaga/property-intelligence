name: CI

on:
  push:
    branches: [ main, 'feat/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  DATABASE_URL: postgres://property_intelligence:property_intelligence@localhost:5432/property_intelligence
  REDIS_URL: redis://localhost:6379

jobs:
  build-and-test:
    name: Build & Unit + Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify whitespace formatting
        # Full analyzer/style enforcement still has backlog warnings; the CI gate
        # is intentionally whitespace-only until those warnings are addressed.
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/PropertyIntelligence.Tests.Unit --no-build --configuration Release --verbosity normal

      - name: Contract tests
        run: dotnet test tests/PropertyIntelligence.Tests.Contract --no-build --configuration Release --verbosity normal

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: property_intelligence
          POSTGRES_PASSWORD: property_intelligence
          POSTGRES_DB: property_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify whitespace formatting
        # Full analyzer/style enforcement still has backlog warnings; the CI gate
        # is intentionally whitespace-only until those warnings are addressed.
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test tests/PropertyIntelligence.Tests.Integration --no-build --configuration Release --verbosity normal

  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write  # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/property-intelligence-api:latest
            ghcr.io/${{ github.repository_owner }}/property-intelligence-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K3s
        run: |
          kubectl set image deployment/property-intelligence-api \
            api=ghcr.io/${{ github.repository_owner }}/property-intelligence-api:${{ github.sha }} \
            -n property-intelligence

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/property-intelligence-api \
            -n property-intelligence \
            --timeout=120s
