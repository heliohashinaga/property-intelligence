name: CI

on:
  push:
    branches: [ main, 'feat/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  DATABASE_URL: postgres://property_intelligence:property_intelligence@localhost:5432/property_intelligence
  REDIS_URL: redis://localhost:6379

jobs:
  build-and-test:
    name: Build & Unit + Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/PropertyIntelligence.Tests.Unit --no-build --configuration Release --verbosity normal

      - name: Contract tests
        run: dotnet test tests/PropertyIntelligence.Tests.Contract --no-build --configuration Release --verbosity normal

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: property_intelligence
          POSTGRES_PASSWORD: property_intelligence
          POSTGRES_DB: property_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test tests/PropertyIntelligence.Tests.Integration --no-build --configuration Release --verbosity normal
