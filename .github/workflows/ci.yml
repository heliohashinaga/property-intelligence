name: CI

on:
  push:
    branches: [ main, 'feat/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  DATABASE_URL: postgres://property_intelligence:property_intelligence@localhost:5432/property_intelligence
  REDIS_URL: redis://localhost:6379

jobs:
  build-and-test:
    name: Build & Unit + Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify whitespace formatting
        # Full analyzer/style enforcement still has backlog warnings; the CI gate
        # is intentionally whitespace-only until those warnings are addressed.
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/PropertyIntelligence.Tests.Unit --no-build --configuration Release --verbosity normal

      - name: Contract tests
        run: dotnet test tests/PropertyIntelligence.Tests.Contract --no-build --configuration Release --verbosity normal
