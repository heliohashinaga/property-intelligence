name: CI

on:
  push:
    branches: [ main, 'feat/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  DATABASE_URL: postgres://property_intelligence:property_intelligence@localhost:5432/property_intelligence
  REDIS_URL: redis://localhost:6379

jobs:
  build-and-test:
    name: Build & Unit + Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/PropertyIntelligence.Tests.Unit --no-build --configuration Release --verbosity normal

      - name: Contract tests
        run: dotnet test tests/PropertyIntelligence.Tests.Contract --no-build --configuration Release --verbosity normal

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: property_intelligence
          POSTGRES_PASSWORD: property_intelligence
          POSTGRES_DB: property_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test tests/PropertyIntelligence.Tests.Integration --no-build --configuration Release --verbosity normal

  deploy:
    name: Deploy to K3s Production
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify incident-response.md exists (T086 gate)
        run: |
          if [ ! -f docs/incident-response.md ]; then
            echo "ERROR: docs/incident-response.md is required before production deploy."
            echo "See T086 — create the LGPD incident response plan first."
            exit 1
          fi
          echo "docs/incident-response.md found ✔"

      - name: Verify data-inventory.md exists (T087 gate)
        run: |
          if [ ! -f docs/data-inventory.md ]; then
            echo "ERROR: docs/data-inventory.md is required before production deploy."
            echo "See T087 — create the LGPD data inventory first."
            exit 1
          fi
          echo "docs/data-inventory.md found ✔"

      - name: Set up kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K3s
        run: |
          kubectl set image deployment/property-intelligence-api \
            api=ghcr.io/heliomarpm/property-intelligence-api:${{ github.sha }} \
            -n property-intelligence

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/property-intelligence-api \
            -n property-intelligence \
            --timeout=300s

      - name: Verify health endpoint
        run: |
          sleep 10
          kubectl run health-check --rm -it --restart=Never \
            --image=curlimages/curl:latest \
            -n property-intelligence \
            -- curl -sf http://property-intelligence-api/health && echo 'Health check passed ✔'
