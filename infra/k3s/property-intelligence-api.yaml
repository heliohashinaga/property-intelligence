---
# ConfigMap — non-secret environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-config
  namespace: property-intelligence
data:
  LLM_MODEL: "anthropic/claude-3-haiku"
  REDIS_URL: "redis://redis:6379"
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-intelligence-api
  namespace: property-intelligence
  labels:
    app: property-intelligence-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: property-intelligence-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: property-intelligence-api
    spec:
      containers:
        - name: api
          image: ghcr.io/heliomarpm/property-intelligence-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pi-config
            - secretRef:
                name: pi-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

---
# Service (ClusterIP — exposed externally via Cloudflare Tunnel)
apiVersion: v1
kind: Service
metadata:
  name: property-intelligence-api
  namespace: property-intelligence
spec:
  selector:
    app: property-intelligence-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: property-intelligence-api-hpa
  namespace: property-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: property-intelligence-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
