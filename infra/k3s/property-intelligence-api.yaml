# ── Property Intelligence API — Deployment + Service ─────────────────────────
#
# Secrets expected in the namespace:
#   kubectl create secret generic property-intelligence-secrets \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=OPENROUTER_API_KEY='...' \
#     --from-literal=API_KEY_SALT='...' \
#     --from-literal=CLOUDFLARE_TUNNEL_TOKEN='...' \
#     --from-literal=GRAFANA_OTLP_ENDPOINT='...' \
#     --from-literal=GRAFANA_OTLP_TOKEN='...' \
#     --from-literal=IPTU_API_KEY='...' \
#     -n property-intelligence
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-intelligence-api
  namespace: property-intelligence
  labels:
    app: property-intelligence-api
    app.kubernetes.io/version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: property-intelligence-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: property-intelligence-api
    spec:
      containers:
        - name: api
          image: ghcr.io/heliohashinaga/property-intelligence-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: property-intelligence-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: property-intelligence-secrets
                  key: REDIS_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: property-intelligence-secrets
                  key: OPENROUTER_API_KEY
            - name: API_KEY_SALT
              valueFrom:
                secretKeyRef:
                  name: property-intelligence-secrets
                  key: API_KEY_SALT
            - name: GRAFANA_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: property-intelligence-secrets
                  key: GRAFANA_OTLP_ENDPOINT
            - name: GRAFANA_OTLP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: property-intelligence-secrets
                  key: GRAFANA_OTLP_TOKEN
            - name: IPTU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: property-intelligence-secrets
                  key: IPTU_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: property-intelligence-api
  namespace: property-intelligence
  labels:
    app: property-intelligence-api
spec:
  selector:
    app: property-intelligence-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
