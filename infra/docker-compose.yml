# docker-compose.yml — Cloudflare Tunnel only
#
# PostgreSQL, Redis, and the API are now fully managed by .NET Aspire (AppHost).
# Use this file only when you need the Cloudflare tunnel for staging/public access.
#
# Usage:
#   CLOUDFLARE_TUNNEL_TOKEN=<token> docker compose --profile tunnel up -d

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: property-intelligence-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles:
      - tunnel
